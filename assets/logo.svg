<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 100 100" role="img" aria-label="Visual Studio MCP Bridge">
  <!-- Fond creme, coins arrondis, comme l'icone Claude -->
  <rect width="100" height="100" rx="22" fill="#F4EFE6"/>
  <!-- Etoile orange : rayons de longueurs inegales, bouts arrondis -->
  <g stroke="#D97757" stroke-width="9" stroke-linecap="round" transform="translate(46 50)">
    <line x1="0" y1="0" x2="0" y2="-31"/>
    <line x1="0" y1="0" x2="17" y2="-25"/>
    <line x1="0" y1="0" x2="28" y2="-12"/>
    <line x1="0" y1="0" x2="26" y2="8"/>
    <line x1="0" y1="0" x2="15" y2="24"/>
    <line x1="0" y1="0" x2="-3" y2="30"/>
    <line x1="0" y1="0" x2="-20" y2="22"/>
    <line x1="0" y1="0" x2="-30" y2="6"/>
    <line x1="0" y1="0" x2="-27" y2="-14"/>
    <line x1="0" y1="0" x2="-14" y2="-27"/>
  </g>
  <!-- Badge Visual Studio, violet, qui mord sur l'etoile -->
  <rect x="56" y="56" width="38" height="38" rx="11" fill="#F4EFE6"/>
  <rect x="60" y="60" width="30" height="30" rx="8" fill="#5C2D91"/>
  <text x="75" y="81" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">VS</text>
</svg>
